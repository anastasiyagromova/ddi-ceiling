[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ddiceil"
dynamic = ["version"]
description = "Ceilings, forecasts and shortcut audits for drug-drug interaction learning."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Anastasiya Gromova" },
    { name = "Anthony S. Maida" },
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
examples = ["pandas>=1.5.0", "matplotlib>=3.7.1", "jupyter>=1.0.0"]
test = ["pytest>=7.0.0,<9"]

[project.urls]
Repository = "https://github.com/anastasiyagromova/ddi-ceiling"

[tool.setuptools.dynamic]
version = { attr = "ddiceil.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ddiceil*"]

[tool.pytest.ini_options]
testpaths = ["src"]
